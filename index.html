<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Perfumes</title>
  <style>
    :root {
      --bg-color: #0b1d17;
      --card-bg: #122b22;
      --accent-gold: #c5a059;
      --text-light: #e0e0e0;
      --text-muted: #a0b0a8;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-light);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* FORMULARIO DE ADMINISTRACIÓN */
    .admin-panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      border: 1px solid rgba(197, 160, 89, 0.2);
    }
    .admin-panel h2 { color: var(--accent-gold); margin-top: 0; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 15px;
    }
    input, select, textarea {
      background: #07130f;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 10px;
      border-radius: 5px;
      width: 100%;
      box-sizing: border-box;
    }
    button.btn-primary {
      background: var(--accent-gold);
      color: #000;
      border: none;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }
    button.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* CATÁLOGO DE PRODUCTOS */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #fff;
      border-radius: 5px;
    }
    .product-card h3 { margin: 10px 0 5px 0; color: #fff; }
    .product-card p { margin: 0; color: var(--text-muted); font-size: 13px; }
    .product-card .price { color: var(--accent-gold); font-weight: bold; font-size: 16px; margin-top: 8px; }

    /* MODAL FICHA TÉCNICA */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--card-bg);
      color: var(--text-light);
      width: 90%; max-width: 800px;
      max-height: 90vh; overflow-y: auto;
      border-radius: 12px; display: flex; flex-direction: row;
      position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-close {
      position: absolute; top: 15px; right: 15px;
      background: rgba(255,255,255,0.1); border: none;
      color: #fff; border-radius: 50%; width: 32px; height: 32px;
      cursor: pointer; font-size: 16px;
    }
    .modal-img-container {
      width: 45%; background: #ffffff;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-img-container img { max-width: 100%; max-height: 350px; object-fit: contain; }
    .modal-info { width: 55%; padding: 25px; display: flex; flex-direction: column; gap: 10px; }
    .modal-brand { text-transform: uppercase; font-size: 11px; letter-spacing: 2px; color: var(--accent-gold); font-weight: bold; }
    .modal-title { font-size: 24px; color: #ffffff; margin: 0; }
    .modal-subtitle { font-size: 13px; color: var(--text-muted); }
    .modal-price { font-size: 18px; font-weight: bold; color: #ffffff; margin-bottom: 5px; }

    /* BARRAS DE PROGRESO DE NOTAS */
    .note-group { margin-top: 4px; }
    .note-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; letter-spacing: 1px; color: #d0d0d0; }
    .progress-bar-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 3px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #c5a059, #f3e5ab); width: 0%; transition: width 0.6s ease; }
    .note-description { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .modal-section-title { font-size: 13px; font-weight: bold; color: #ffffff; margin-top: 8px; }
    .modal-section-desc { font-size: 12px; color: var(--text-muted); line-height: 1.3; }

    .modal-tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .modal-tag { border: 1px solid rgba(197, 160, 89, 0.5); border-radius: 20px; padding: 4px 10px; font-size: 11px; color: var(--accent-gold); }
    .modal-tag.highlight { background: var(--accent-gold); color: #000; font-weight: bold; }

    @media (max-width: 768px) {
      .modal-card { flex-direction: column; }
      .modal-img-container, .modal-info { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- PANEL DE ADMINISTRACIÓN -->
  <div class="admin-panel">
    <h2>Gestión de Productos</h2>
    <form id="addProductForm" onsubmit="saveProduct(event)">
      <div class="form-grid">
        <input type="text" id="pBrand" placeholder="Marca (ej: AFNAN)" required>
        <input type="text" id="pName" placeholder="Nombre (ej: 9PM)" required>
        <input type="text" id="pStyle" placeholder="Estilo / Familia" required>
        <input type="number" id="pPrice" placeholder="Precio ($)" required>
        <input type="number" id="pDecant" placeholder="Precio Decant ($)" required>
        <select id="pGender" required>
          <option value="Masculino">Masculino</option>
          <option value="Femenino">Femenino</option>
          <option value="Unisex">Unisex</option>
        </select>
        <input type="text" id="pDur" placeholder="Duración (ej: 8 - 10 Hs)" required>
      </div>

      <div class="form-grid">
        <input type="text" id="pSalidaNotas" placeholder="Notas de Salida">
        <input type="number" id="pSalidaVal" placeholder="% Salida (0-100)" min="0" max="100">
        <input type="text" id="pCorazonNotas" placeholder="Notas de Corazón">
        <input type="number" id="pCorazonVal" placeholder="% Corazón (0-100)" min="0" max="100">
        <input type="text" id="pFondoNotas" placeholder="Notas de Fondo">
        <input type="number" id="pFondoVal" placeholder="% Fondo (0-100)" min="0" max="100">
      </div>

      <div class="form-grid">
        <input type="text" id="pPkg" placeholder="El frasco y la caja">
        <input type="text" id="pHigh" placeholder="Por qué destaca">
        <input type="file" id="pFile" accept="image/*">
        <input type="text" id="pImg" placeholder="O pega la URL de la imagen directamente">
      </div>

      <button type="submit" id="saveBtn" class="btn-primary">Guardar Producto</button>
      <div id="adminStatus" style="margin-top: 10px; font-size: 14px;"></div>
    </form>
  </div>

  <!-- CATÁLOGO PRINCIPAL -->
  <h2>Catálogo de Productos</h2>
  <div id="catalogContainer" class="catalog-grid"></div>

  <!-- MODAL FICHA TÉCNICA -->
  <div id="productModal" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-img-container">
        <img id="mImg" src="" alt="Producto">
      </div>
      <div class="modal-info">
        <div id="mBrand" class="modal-brand">MARCA</div>
        <h2 id="mName" class="modal-title">Nombre</h2>
        <div id="mSubtitle" class="modal-subtitle">Estilo - Género</div>
        <div id="mPrice" class="modal-price">$0</div>

        <div class="note-group">
          <div class="note-header"><span>SALIDA</span></div>
          <div class="progress-bar-bg"><div id="mSalidaBar" class="progress-bar-fill"></div></div>
          <div id="mSalidaTxt" class="note-description"></div>
        </div>

        <div class="note-group">
          <div class="note-header"><span>CORAZÓN</span></div>
          <div class="progress-bar-bg"><div id="mCorazonBar" class="progress-bar-fill"></div></div>
          <div id="mCorazonTxt" class="note-description"></div>
        </div>

        <div class="note-group">
          <div class="note-header"><span>FONDO</span></div>
          <div class="progress-bar-bg"><div id="mFondoBar" class="progress-bar-fill"></div></div>
          <div id="mFondoTxt" class="note-description"></div>
        </div>

        <div class="modal-section-title">El frasco y la caja</div>
        <div id="mPkg" class="modal-section-desc"></div>

        <div class="modal-section-title">Por qué destaca</div>
        <div id="mHigh" class="modal-section-desc"></div>

        <div class="modal-tags">
          <span id="mDur" class="modal-tag"></span>
          <span id="mDecant" class="modal-tag highlight"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // REEMPLAZA CON LA URL DESPLEGADA DE TU GOOGLE APPS SCRIPT
    const API_URL = "URL_DE_TU_APPS_SCRIPT_AQUI";

    let catalogProducts = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadProducts();
    });

    async function loadProducts() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        catalogProducts = data;
        renderCatalog(data);
      } catch (err) {
        console.error("Error al cargar productos:", err);
      }
    }

    function renderCatalog(products) {
      const container = document.getElementById('catalogContainer');
      if (!products || products.length === 0) {
        container.innerHTML = '<p>No hay productos cargados.</p>';
        return;
      }

      container.innerHTML = products.map((p, index) => {
        const priceFormatted = p.price ? Number(p.price).toLocaleString() : '0';
        const imgUrl = p.img || 'https://via.placeholder.com/200?text=Sin+Imagen';

        return `
          <div class="product-card" onclick="openModal(${index})">
            <img src="${imgUrl}" alt="${p.name || ''}">
            <h3>${p.name || 'Sin nombre'}</h3>
            <p>${p.brand || ''}</p>
            <div class="price">$${priceFormatted}</div>
          </div>
        `;
      }).join('');
    }

    function openModal(index) {
      const p = catalogProducts[index];
      if (!p) return;

      document.getElementById('mImg').src = p.img || 'https://via.placeholder.com/200?text=Sin+Imagen';
      document.getElementById('mBrand').innerText = p.brand || '';
      document.getElementById('mName').innerText = p.name || 'Sin nombre';
      document.getElementById('mSubtitle').innerText = `${p.style || ''} - ${p.gender || ''}`;
      document.getElementById('mPrice').innerText = `$${p.price ? Number(p.price).toLocaleString() : '0'}`;

      document.getElementById('mSalidaTxt').innerText = p.salidaNotas || 'N/A';
      document.getElementById('mSalidaBar').style.width = `${p.salidaVal || 0}%`;

      document.getElementById('mCorazonTxt').innerText = p.corazonNotas || 'N/A';
      document.getElementById('mCorazonBar').style.width = `${p.corazonVal || 0}%`;

      document.getElementById('mFondoTxt').innerText = p.fondoNotas || 'N/A';
      document.getElementById('mFondoBar').style.width = `${p.fondoVal || 0}%`;

      document.getElementById('mPkg').innerText = p.packaging || 'Sin información disponible.';
      document.getElementById('mHigh').innerText = p.highlights || 'Sin información disponible.';

      document.getElementById('mDur').innerText = p.dur || 'N/A';
      document.getElementById('mDecant').innerText = `Decant: $${p.decant ? Number(p.decant).toLocaleString() : '0'}`;

      document.getElementById('productModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('productModal').classList.remove('active');
    }

    async function saveProduct(event) {
      event.preventDefault();
      const statusDiv = document.getElementById('adminStatus');
      const saveBtn = document.getElementById('saveBtn');

      const fileInput = document.getElementById('pFile');
      const file = fileInput.files[0];
      const urlInput = document.getElementById('pImg').value.trim();

      saveBtn.disabled = true;
      statusDiv.innerText = 'Procesando datos...';

      let payload = {
        brand: document.getElementById('pBrand').value,
        name: document.getElementById('pName').value,
        style: document.getElementById('pStyle').value,
        price: document.getElementById('pPrice').value,
        decant: document.getElementById('pDecant').value,
        gender: document.getElementById('pGender').value,
        dur: document.getElementById('pDur').value,
        salidaNotas: document.getElementById('pSalidaNotas').value,
        salidaVal: document.getElementById('pSalidaVal').value,
        corazonNotas: document.getElementById('pCorazonNotas').value,
        corazonVal: document.getElementById('pCorazonVal').value,
        fondoNotas: document.getElementById('pFondoNotas').value,
        fondoVal: document.getElementById('pFondoVal').value,
        packaging: document.getElementById('pPkg').value,
        highlights: document.getElementById('pHigh').value,
        img: urlInput
      };

      if (file) {
        try {
          const compressed = await compressImage(file, 800, 0.7);
          payload.fileData = compressed.base64;
          payload.fileName = file.name;
          payload.mimeType = 'image/jpeg';
        } catch (err) {
          statusDiv.innerText = 'Error al comprimir la imagen.';
          saveBtn.disabled = false;
          return;
        }
      }

      await sendPayload(payload);
    }

    function compressImage(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve({ base64: canvas.toDataURL('image/jpeg', quality) });
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    async function sendPayload(payload) {
      const statusDiv = document.getElementById('adminStatus');
      const saveBtn = document.getElementById('saveBtn');

      try {
        statusDiv.innerText = 'Guardando en la base de datos...';
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        statusDiv.innerHTML = '<span style="color:#25D366;">✓ ¡Guardado con éxito!</span>';
        document.getElementById('addProductForm').reset();
        setTimeout(loadProducts, 1500);
      } catch (err) {
        statusDiv.innerHTML = '<span style="color:#ff6b6b;">Error al guardar.</span>';
      } finally {
        saveBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
